name: Expo SDK 58 compatibility

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - '.github/workflows/expo-compatibility.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Check Expo package alignment
        run: npx expo install --check
      - name: TypeScript
        run: npm run typecheck
      - name: Expo Doctor
        run: npx expo-doctor@latest
